schema_version: 1

context:
  version: "1.0.1"

package:
  name: pystac-ext-sar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-sar/pystac_ext_sar-${{ version }}.tar.gz
  sha256: 3a1a24a7429d74570a3fb93c534095c18fb42e1b3c8e1c4cdb594091eb23ee0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.sar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: SAR extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-sar/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
